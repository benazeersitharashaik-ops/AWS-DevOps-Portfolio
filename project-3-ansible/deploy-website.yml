---
- name: Deploy website
  hosts: webservers
  become: yes

  tasks:
    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create website page
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Ansible Deployment</title>
          </head>
          <body>
            <h1>Welcome!</h1>
            <p>Website deployed using Ansible Automation.</p>
          </body>
          </html>
        dest: /usr/share/nginx/html/index.html

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
